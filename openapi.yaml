      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluacionInput" }
      responses:
        "201": { description: Evaluación creada }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Puntaje máximo acumulado superior a 100 }
  /api/evaluaciones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [Evaluaciones]
      summary: Actualizar evaluación (admin o catedrático responsable)
      responses:
        "200": { description: Evaluación actualizada }
        "409": { description: Máximo incompatible con otras evaluaciones o notas existentes }
    delete:
      tags: [Evaluaciones]
      summary: Desactivar evaluación sin calificaciones (admin o responsable)
      responses:
