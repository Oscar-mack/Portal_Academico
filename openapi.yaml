      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequisitoSolvenciaDocumentoCreate" }
      responses:
        "201": { description: Requisito creado }
        "400": { $ref: "#/components/responses/BadRequest" }
