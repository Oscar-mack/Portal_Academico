      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequisitoSolvenciaDocumentoInput" }
      responses:
        "200": { description: Requisito actualizado }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    Message:
      description: Operación exitosa
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token inválido o expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Sin token o sin permisos para el recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    Rol:
      type: string
      enum: [admin, catedratico, alumno, padre]
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    SignInResponse:
      type: object
      properties:
        message: { type: string }
        token: { type: string }
        accessToken: { type: string }
        expiresIn: { type: string, example: 8h }
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
        usuario:
          type: object
          properties:
            id: { type: integer }
            rol: { $ref: "#/components/schemas/Rol" }
    SignUpRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        rol: { $ref: "#/components/schemas/Rol" }
        catedraticoId: { type: integer, description: Solo rol catedratico }
        alumnoId: { type: integer, description: Solo rol alumno }
        alumnoIds:
          type: array
          items: { type: integer }
          description: Solo rol padre
    Usuario:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string, format: email }
        rol: { $ref: "#/components/schemas/Rol" }
        activo: { type: boolean }
        perfilCatedratico: { $ref: "#/components/schemas/Catedratico" }
        perfilAlumno: { $ref: "#/components/schemas/Alumno" }
    GradoCarreraInput:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string }
        nivel: { type: string, example: Universitario }
        descripcion: { type: string }
        activo: { type: boolean }
    GradoCarrera:
      allOf:
        - $ref: "#/components/schemas/GradoCarreraInput"
        - type: object
          properties:
            id: { type: integer }
    CatedraticoInput:
      type: object
      required: [nombre, apellido, email]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string, format: email }
        telefono: { type: string }
        especialidad: { type: string }
    Catedratico:
      allOf:
        - $ref: "#/components/schemas/CatedraticoInput"
        - type: object
          properties:
            id: { type: integer }
            usuarioId: { type: integer, nullable: true }
            activo: { type: boolean }
    AlumnoInput:
      type: object
      required: [nombre, apellido, email, gradoCarreraId]
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string, format: email }
        telefono: { type: string }
        gradoCarreraId: { type: integer }
    Alumno:
      allOf:
        - $ref: "#/components/schemas/AlumnoInput"
        - type: object
          properties:
            id: { type: integer }
            usuarioId: { type: integer, nullable: true }
            activo: { type: boolean }
            gradoCarrera: { $ref: "#/components/schemas/GradoCarrera" }
    CursoInput:
      type: object
      required: [nombre, codigo, gradoCarreraId]
      properties:
        nombre: { type: string }
        codigo: { type: string }
        creditos: { type: integer }
        gradoCarreraId: { type: integer }
    Curso:
      allOf:
        - $ref: "#/components/schemas/CursoInput"
        - type: object
          properties:
            id: { type: integer }
            activo: { type: boolean }
    AsignacionInput:
      type: object
      required: [alumnoId, cursoId]
      properties:
        alumnoId: { type: integer }
        cursoId: { type: integer }
        periodo: { type: string, default: "2026" }
        periodoAcademicoId: { type: integer, nullable: true }
    AsignacionCurso:
      allOf:
        - $ref: "#/components/schemas/AsignacionInput"
        - type: object
          properties:
            id: { type: integer }
    HorarioInput:
      type: object
      required: [catedraticoId, cursoId, dia, horaInicio, horaFin]
      properties:
        catedraticoId: { type: integer }
        cursoId: { type: integer }
        dia: { type: string, enum: [Lunes, Martes, Miercoles, Jueves, Viernes, Sabado] }
        horaInicio: { type: string, example: "08:00", pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        horaFin: { type: string, example: "10:00", pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        periodo: { type: string, default: "2026" }
        periodoAcademicoId: { type: integer, nullable: true }
    Horario:
      allOf:
        - $ref: "#/components/schemas/HorarioInput"
        - type: object
          properties:
            id: { type: integer }
    PadreAlumno:
      type: object
      properties:
        id: { type: integer }
        usuarioId: { type: integer }
        alumnoId: { type: integer }
        parentesco: { type: string }
    NotaInput:
      type: object
      required: [alumnoId, cursoId, valor]
      properties:
        alumnoId: { type: integer }
        cursoId: { type: integer }
        valor: { type: number, minimum: 0, maximum: 100 }
        periodo: { type: string, default: "2026" }
        catedraticoId: { type: integer, description: Obligatorio si quien registra es admin }
    Nota:
      type: object
      properties:
        id: { type: integer }
        alumnoId: { type: integer }
        cursoId: { type: integer }
        catedraticoId: { type: integer }
        valor: { type: number }
        estado: { type: string, enum: [aprobado, reprobado], description: "61 o más aprueba" }
        periodo: { type: string }
        periodoAcademicoId: { type: integer, nullable: true }
    Indicadores:
      type: object
      properties:
        totalAlumnos: { type: integer }
        totalNotasEvaluadas: { type: integer }
        aprobados: { type: integer }
        reprobados: { type: integer }
        porcentajeAprobacion: { type: number }
        distribucionPorRango:
          type: object
          additionalProperties: { type: integer }
          example: { "0-60 (Reprobado)": 3, "61-70": 5, "71-80": 8, "81-90": 4, "91-100": 2 }
    CheckoutRequest:
      type: object
      required: [cargoId]
      properties:
        cargoId: { type: integer }
        monto: { type: number, exclusiveMinimum: 0, description: Abono opcional validado contra el saldo por el servidor }
    CheckoutResponse:
      type: object
      properties:
        pagoId: { type: integer }
        sessionId: { type: string }
        url: { type: string, format: uri }
    Pago:
      type: object
      properties:
        id: { type: integer }
        alumnoId: { type: integer }
        concepto: { type: string }
        monto: { type: number }
        moneda: { type: string, example: usd }
        estado: { type: string, enum: [pendiente, pagado, fallido, cancelado, anulado] }
        motivoAnulacion: { type: string, nullable: true }
        anuladoEn: { type: string, format: date-time, nullable: true }
        fechaPago: { type: string, format: date-time, nullable: true }
        alumno: { $ref: "#/components/schemas/Alumno" }
        cargo: { $ref: "#/components/schemas/Cargo" }
    CicloAcademicoInput:
      type: object
      required: [nombre, fechaInicio, fechaFin]
      properties:
        nombre: { type: string, maxLength: 80 }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
    PeriodoAcademicoInput:
      type: object
      required: [cicloAcademicoId, nombre, tipo, fechaInicio, fechaFin]
      properties:
        cicloAcademicoId: { type: integer }
        nombre: { type: string, maxLength: 80 }
        tipo: { type: string, enum: [bimestre, trimestre, semestre] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
    EvaluacionInput:
      type: object
      required: [cursoId, periodoAcademicoId, nombre, puntajeMaximo]
      properties:
        cursoId: { type: integer }
        catedraticoId: { type: integer, description: Obligatorio para administración }
        periodoAcademicoId: { type: integer }
        nombre: { type: string, maxLength: 120 }
        puntajeMaximo: { type: number, exclusiveMinimum: 0, maximum: 100 }
    CalificacionEvaluacionInput:
      type: object
      required: [alumnoId, valor]
      properties:
        alumnoId: { type: integer }
        valor: { type: number, minimum: 0 }
        motivo: { type: string }
    CargoInput:
      type: object
      required: [alumnoId, concepto, montoOriginal]
      properties:
        alumnoId: { type: integer }
        concepto: { type: string, maxLength: 160 }
        descripcion: { type: string }
        montoOriginal: { type: number, exclusiveMinimum: 0 }
        moneda: { type: string, enum: [GTQ, USD], default: GTQ }
        fechaEmision: { type: string, format: date }
        fechaVencimiento: { type: string, format: date, nullable: true }
        cicloAcademicoId: { type: integer, nullable: true }
        periodoAcademicoId: { type: integer, nullable: true }
    Cargo:
      allOf:
        - $ref: "#/components/schemas/CargoInput"
        - type: object
          properties:
            id: { type: integer }
            montoPagado: { type: number }
            saldoPendiente: { type: number, minimum: 0 }
            estado: { type: string, enum: [pendiente, parcial, pagado, vencido, anulado] }
            anuladoEn: { type: string, format: date-time, nullable: true }
            pagos:
              type: array
              items: { $ref: "#/components/schemas/Pago" }
    AlumnoVinculado:
      type: object
      properties:
        vinculoId: { type: integer }
        parentesco: { type: string, nullable: true }
        alumno: { $ref: "#/components/schemas/Alumno" }
    RequisitoSolvenciaDocumentoInput:
      type: object
      properties:
        tipoDocumento: { type: string, minLength: 1, maxLength: 80 }
        requiereSolvencia: { type: boolean }
    RequisitoSolvenciaDocumentoCreate:
      allOf:
        - $ref: "#/components/schemas/RequisitoSolvenciaDocumentoInput"
        - type: object
          required: [tipoDocumento, requiereSolvencia]
    RequisitoSolvenciaDocumento:
      allOf:
        - $ref: "#/components/schemas/RequisitoSolvenciaDocumentoInput"
        - type: object
          properties:
            id: { type: integer }
    Dashboard:
      type: object
      required: [rol]
      properties:
        rol: { $ref: "#/components/schemas/Rol" }
        resumen:
          type: object
          additionalProperties: true
        alumno:
          type: object
          additionalProperties: true
        alumnos:
          type: array
          items:
            type: object
            additionalProperties: true
        cursos:
          type: array
          items:
            type: object
            additionalProperties: true
